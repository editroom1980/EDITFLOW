<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIT&amp;EAT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1C090D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF3F2" media="(prefers-color-scheme: light)">
<script>/* 設定の「画面の色」を、描く前に当てる（開いた瞬間に色が変わって見えないように） */try{var t=JSON.parse(localStorage.getItem('nagara:画面の色')||'"auto"');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);var c=t==='dark'?'#1C090D':'#FBF3F2';document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',c)});var sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(sb)sb.setAttribute('content',t==='dark'?'black':'default')}}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}
/* ノッチの下に中身が入り込んでぼやけないよう、その高さを地の色で塗って固定する（2026-11-10 依頼者「ノッチ付近がぼやけている」） */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg,#1C090D);z-index:30}</style>
</head>
<body>
<title>FIT&amp;EAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* 構成：下のタブで「トレーニング｜食事｜買い物」を切り替える。
   トレーニング＝本日のセッション → 週間目標 → 指標3つ → コア → アクティビティ → メニュー一覧
   食事＝本日の条件（トレーニング日・たんぱく質目標）→ 調理時間5段階・ジャンル・テイスト → 提案3件 → 献立
   買い物＝7日間の献立（自動作成・入れ替え）→ 売り場別の買い物リスト
   運動中は全画面（輪＝残り秒。ワーク緑・レスト黄・ウォームアップとクールダウン青）*/
:root{
  --bg:#1C090D; --surface:#2A0F15; --raise:#37161D; --ink:#FFF3F0; --muted:#CDA29E; --line:#4B1E26;
  --go:#FF5A44; --go-ink:#FFFFFF; --rest:#FFC24B; --prep:#7FD3F5; --food:#FFB15C; --far:#FFF3F0; --heat0:#2E1117;
  --hero1:#7A1828; --hero2:#4A0C16;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"Barlow Condensed","Hiragino Sans",sans-serif;
  --nav-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FBF3F2; --surface:#FFFFFF; --raise:#F6E6E3; --ink:#2A0A10; --muted:#8A5F5C; --line:#EBD3D0;
  --go:#E23B2C; --go-ink:#FFFFFF; --rest:#B8740E; --prep:#1F78A8; --food:#B85A1B; --far:#2A0A10; --heat0:#F3E3E1;
  --hero1:#FFE6E0; --hero2:#FFD3CB; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FBF3F2; --surface:#FFFFFF; --raise:#F6E6E3; --ink:#2A0A10; --muted:#8A5F5C; --line:#EBD3D0;
  --go:#E23B2C; --go-ink:#FFFFFF; --rest:#B8740E; --prep:#1F78A8; --food:#B85A1B; --far:#2A0A10; --heat0:#F3E3E1;
  --hero1:#FFE6E0; --hero2:#FFD3CB; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
/* iPhone の画面上のぼやけ対策（全アプリ共通の決まり）：上の安全域を地の色で塗り、画面の箱を固定して中だけ動かす */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;pointer-events:none}
.scr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg)}
/* 拡大とずれを止める（2026-11-10 依頼者「表示を拡大したりズレたりしないように」）
   ダブルタップの拡大を止め、横のはみ出しと端の跳ね返りを止める。入力欄は16px以上（iPhone は小さい入力欄に触れると自動で拡大する） */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;overscroll-behavior:none}
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--go);outline-offset:2px}
p{margin:0;text-wrap:pretty}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.label{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:3px 10px;background:var(--raise);color:var(--muted)}
.pill.t-go{background:color-mix(in srgb,var(--go) 18%,transparent);color:var(--go)}
.pill.t-food{background:color-mix(in srgb,var(--food) 18%,transparent);color:var(--food)}
.pill.t-prep{background:color-mix(in srgb,var(--prep) 18%,transparent);color:var(--prep)}
abbr[title]{text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent);text-underline-offset:3px;cursor:help}

/* ── 共通の枠 ── */
.wrap{max-width:1040px;margin:0 auto;padding-block:20px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 2px 2px}
.vhead h1{font-size:28px;font-weight:900;letter-spacing:.02em}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;letter-spacing:.16em;color:var(--go);margin:0 0 4px}
.brand .mark{width:28px;height:28px;border-radius:7px;box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent)}
.vhead .d{font-size:13px;color:var(--muted)}
.vhead{align-items:stretch}
.vhead > div:first-child{display:flex;flex-direction:column;justify-content:space-between}
.vhead .vr{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px}
.gear{appearance:none;width:40px;height:40px;margin-top:var(--gear-dy,-6px);border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setg{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.setg .hint{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.switch.row{justify-content:space-between;width:100%;font-size:15px;color:var(--ink);min-height:40px}
.ver{display:flex;flex-direction:column;gap:2px;margin:0}
.ver b{font-size:17px}
.ver span{font-size:12px;color:var(--muted);font-family:var(--f-num);letter-spacing:.04em}
.sub-btn{appearance:none;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;min-height:48px}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:min(520px,100%)}
nav.tabs button{appearance:none;border:0;background:none;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);cursor:pointer;min-height:52px}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--raise)}
nav.tabs button[aria-current="page"] svg{stroke:var(--go)}
nav.tabs button[data-v="food"][aria-current="page"] svg{stroke:var(--food)}
nav.tabs button[data-v="shop"][aria-current="page"] svg{stroke:var(--prep)}

/* ── トレーニング ── */
.hero{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--go) 35%,var(--line));
  background:linear-gradient(160deg,var(--hero1) 0%,var(--hero2) 100%);display:flex;flex-direction:column;gap:12px}
.hero > *:not(.deco){position:relative;z-index:1}
.hero .deco{position:absolute;right:-34px;top:-34px;width:160px;height:160px;transform:rotate(-90deg);pointer-events:none}
.hero .deco circle{fill:none;stroke-width:15;stroke-linecap:round}
.hero .deco .t{stroke:color-mix(in srgb,var(--go) 22%,transparent)}
.hero .deco .a{stroke:var(--go);stroke-dasharray:196 252;opacity:.45}
.hero.off{border-color:var(--line);background:var(--surface)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .title{display:flex;align-items:baseline;gap:12px;min-width:0}
.hero .k{font-family:var(--f-num);font-weight:700;font-size:68px;line-height:.85;color:var(--go)}
.hero .name{font-size:clamp(22px,4.6vw,30px);font-weight:900;line-height:1.2}
.hero .sub{font-size:14px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px}
.facts span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.facts b{display:block;color:var(--ink);font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.05;letter-spacing:0}
.facts b small{font-size:14px;color:var(--muted);margin-left:1px}
.hero .actions{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.go{appearance:none;border:0;border-radius:16px;background:var(--go);color:var(--go-ink);font-size:19px;font-weight:900;letter-spacing:.12em;padding:15px 28px;cursor:pointer;flex:1 1 200px;display:flex;align-items:center;justify-content:center;gap:10px}
.go svg{width:18px;height:18px;fill:currentColor}
.go:active{transform:scale(.985)}
.go.food{background:var(--food)}
.go.ghost{background:var(--raise);color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.switch input:checked{background:var(--go)}
.switch input:checked::after{transform:translateX(16px);background:var(--go-ink)}
.advice{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;font-size:14px;background:color-mix(in srgb,var(--rest) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--rest) 35%,var(--line))}
.advice b{color:var(--rest);white-space:nowrap}

.week{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.week .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.goal{position:relative;width:92px;height:92px}
.goal svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal .bg{fill:none;stroke:color-mix(in srgb,var(--go) 22%,var(--bg));stroke-width:12}
.goal .fg{fill:none;stroke:var(--go);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.goal .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:30px;font-weight:700}
.goal .v small{font-size:16px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day .dot{width:34px;height:34px;flex:none;border-radius:11px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:18px;font-weight:700;color:var(--muted)}
.day.plan .dot{border-style:solid;border-color:color-mix(in srgb,var(--go) 40%,var(--line));color:color-mix(in srgb,var(--go) 75%,var(--muted))}
.day.fin .dot{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.day.today .w{color:var(--ink);font-weight:700}
.day.today .dot{box-shadow:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--ink) 45%,transparent)}
button.day{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;font-size:11px;color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
button.day:active .dot{transform:scale(.92)}
.weekmsg{grid-column:1/-1;font-size:14px;color:var(--muted)}
.weekmsg b{color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .label{letter-spacing:.1em}
.stat b{font-family:var(--f-num);font-size:34px;line-height:1;font-weight:700}
.stat b small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}

.ladder{display:flex;flex-direction:column;gap:12px}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.steps i{height:8px;border-radius:4px;background:var(--line)}
.steps i.on{background:color-mix(in srgb,var(--prep) 55%,var(--line))}
.steps i.now{background:var(--prep);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--prep)}
.ladder .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ladder .nm{font-weight:700;font-size:17px}
.lvrow{padding-top:10px;border-top:1px solid var(--line)}
.lvk{display:inline-block;font-size:12px;font-weight:700;color:var(--go);border:1px solid color-mix(in srgb,var(--go) 45%,transparent);border-radius:8px;padding:1px 7px;margin-right:8px;vertical-align:2px}
.walk{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.ladder .nx{font-size:13px;color:var(--muted)}
.stepper{display:flex;gap:6px}
.mini{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.mini[disabled]{opacity:.3;cursor:default}

.wchart{display:block;width:100%;max-width:420px;height:auto;margin-top:8px;font-family:var(--f-num)}
.wc-axis{stroke:var(--line);stroke-width:1}
.wc-bar{fill:color-mix(in srgb,var(--go) 55%,var(--heat0))}
.wc-bar.ok,.wc-bar.now{fill:var(--go)}
.wc-bar.zero{fill:var(--line)}
.wc-n{font-size:14px;font-weight:700;fill:var(--go-ink);text-anchor:middle}
.wc-n.z{fill:var(--muted);font-weight:400}
.wchart{max-width:400px}
.wc-d{font-size:11px;fill:var(--muted);text-anchor:middle}
.wc-d.now{fill:var(--ink);font-weight:700}
.wc-goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;opacity:.55}
.wc-gl{font-size:11px;fill:var(--muted);text-anchor:end}
.wnote{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.6}
.heat{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;max-width:300px;margin-top:10px}
.heat .c{display:grid;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--heat0)}
.heat i.l1{background:color-mix(in srgb,var(--go) 35%,var(--heat0))}
.heat i.l2{background:color-mix(in srgb,var(--go) 65%,var(--heat0))}
.heat i.l3{background:var(--go)}
.heat i.t{outline:2px solid color-mix(in srgb,var(--ink) 50%,transparent);outline-offset:1px}
.heat i.f{opacity:.3}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;max-width:300px}

details.fold{padding:0}
details.fold summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
details.fold[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.menulist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mrow{appearance:none;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border:0;border-bottom:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%}
.mrow[aria-current="true"]{background:var(--raise)}
.mrow .k{font-family:var(--f-num);font-size:30px;font-weight:700;color:var(--go);line-height:1}
.mrow .n{font-weight:700;display:block}
.mrow .s{font-size:12px;color:var(--muted)}
.mrow .t{font-family:var(--f-num);font-size:18px;color:var(--muted)}
.mplan{display:flex;flex-direction:column;padding:4px 18px 14px}
.mplan .ph{font-size:11px;font-weight:700;color:var(--muted);padding:12px 0 2px;letter-spacing:.14em}
.mplan .it{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.mplan .it .c{color:var(--muted);font-size:12px;display:block}
.mplan .it .t{font-family:var(--f-num);color:var(--muted);white-space:nowrap}
.settings{display:flex;flex-direction:column;gap:12px;padding:0 18px 16px}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}

/* ── 食事 ── */
.ctx{display:flex;flex-direction:column;gap:12px;border-color:color-mix(in srgb,var(--food) 35%,var(--line));
  background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--food) 13%,transparent) 0%,transparent 62%),var(--surface)}
.ctx .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--food);border-radius:5px;transition:width .6s ease}
.meter .nums{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.meter .nums b{font-family:var(--f-num);font-size:24px;color:var(--ink);font-weight:700}
.daymeals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{appearance:none;border:1px dashed var(--line);background:none;border-radius:14px;padding:10px;text-align:left;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:2px}
.slot.set{border-style:solid;background:var(--raise)}
.slot .label{letter-spacing:.12em}
.slot .n{font-size:13px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.slot .p{font-family:var(--f-num);font-size:15px;color:var(--food)}
/* 今日の食事（朝・昼・夕）と記録 */
.meals{display:flex;flex-direction:column;gap:6px}
.ml{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 8px 8px 12px;border-radius:14px;background:var(--raise);border:1px solid transparent}
.ml .label{letter-spacing:.1em}
.ml .mn{appearance:none;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit;font-size:14px;font-weight:700;line-height:1.35;cursor:pointer;min-width:0;word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty}
.ml .mn small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.ml .mn small b{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--ink)}
.ml.none .mn{color:var(--muted);font-weight:400}
.ml.done{border-color:color-mix(in srgb,var(--go) 45%,transparent)}
.ml.out{border-color:color-mix(in srgb,var(--food) 55%,transparent)}
.icon[aria-pressed="true"]{background:var(--go);border-color:var(--go)}
.icon[aria-pressed="true"] svg{stroke:var(--go-ink)}
.ml .icon[data-out][aria-pressed="true"]{background:var(--food);border-color:var(--food)}
.meter .bar{display:flex;flex-direction:row;gap:0}   /* 運動中の画面の .bar（縦並び）が効かないように */
.meter .bar i{border-radius:0;flex:none}
.meter .bar i.plan{background:color-mix(in srgb,var(--food) 36%,transparent)}
.meter.over .bar i{background:var(--go)}
.meter.over .bar i.plan{background:color-mix(in srgb,var(--go) 40%,transparent)}
.hint{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.hint b{font-family:var(--f-num);font-size:17px;color:var(--ink);font-weight:700}
.go svg.line{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 縦に並ぶ枠の中のボタンは、幅の基準（flex-basis 200px）が高さに効かないように */
.ctx > .go,.sheet .panel > .go,.judge > .go,.shot .go{flex:0 0 auto}
.seg.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.four button{font-size:14px;font-weight:700;padding:9px 2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.shot{display:flex;gap:10px;align-items:center}
.shot img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none}
textarea.text{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical;min-height:84px;line-height:1.5}
.wait{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.wait i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--food);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.judge{display:flex;flex-direction:column;gap:12px}
.pantry{display:flex;flex-direction:column}
.pt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.pt .q{font-family:var(--f-num);font-size:15px;white-space:nowrap}
.pt .d{font-size:12px;color:var(--muted);white-space:nowrap;min-width:52px;text-align:right}
.pt .d.soon{color:var(--go);font-weight:700}
.pt .ed{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.pt .ed input{flex:1 1 90px;max-width:140px}
.warn{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.warn div{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--go) 10%,transparent)}
.src{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.src a{color:var(--food);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.cook{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--food) 50%,var(--line))}
.cook b{color:var(--ink)}
.ing small.have{font-size:11px;font-weight:700;color:var(--go);margin-left:6px;white-space:nowrap}
.ing div span small.muted{font-size:12px;margin-left:4px}
.filters{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--raise);border-radius:14px;padding:4px}
.seg button{appearance:none;border:0;background:none;border-radius:11px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--muted)}
.seg button b{font-family:var(--f-num);font-size:20px;line-height:1.1;color:var(--ink)}
.seg button span{font-size:11px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.seg button[aria-pressed="true"] b{color:var(--food)}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.three button,.seg.two button{font-size:14px;font-weight:700;padding:9px 2px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.two button[aria-pressed="true"]{color:var(--food)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
details.more-f summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
details.more-f summary::-webkit-details-marker{display:none}
details.more-f summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s}
details.more-f[open] summary::before{transform:rotate(45deg)}
.chip{appearance:none;border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--food);color:var(--ink);background:color-mix(in srgb,var(--food) 16%,transparent)}
.fl{display:flex;flex-direction:column;gap:8px}
.fl .label{display:flex;justify-content:space-between}
input.text{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%}
.picks{display:flex;flex-direction:column;gap:10px}
.picks.flash .pick{animation:flash .6s ease}
@keyframes flash{0%{transform:translateY(6px);opacity:.3}100%{transform:none;opacity:1}}
.pick{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;width:100%}
.pick:first-child{border-color:color-mix(in srgb,var(--food) 45%,var(--line))}
.pick .n{font-size:17px;font-weight:900;line-height:1.35}
.pick .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.pick .m b{font-family:var(--f-num);font-size:18px;color:var(--ink);font-weight:600;margin-right:2px}
.pick .m b.p{color:var(--food)}
.pick .tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pick .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg)}
.more{appearance:none;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:6px;align-self:center;text-decoration:underline;text-underline-offset:4px}

/* ── 作り方（シート）── */
.sheet{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:24px;max-height:88vh}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-size:24px;font-weight:900}
.x{appearance:none;border:0;background:var(--raise);border-radius:50%;width:36px;height:36px;cursor:pointer;flex:none;position:relative}
.x::before,.x::after{content:"";position:absolute;left:11px;top:17px;width:14px;height:2px;background:var(--ink);transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles div{background:var(--raise);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tiles b{font-family:var(--f-num);font-size:24px;line-height:1.05}
.tiles b.p{color:var(--food)}
.tiles span{font-size:11px;color:var(--muted)}
.effort{display:flex;gap:3px;height:24px;align-items:center}
.effort i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.effort i.on{background:var(--food)}
.ing{display:flex;flex-direction:column}
.ing div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ing div span:last-child{font-size:14px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ing div.base span:first-child{color:var(--food);font-weight:700}
.rice{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.howto{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:st}
.howto li{text-wrap:pretty;counter-increment:st;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--raise);cursor:pointer;font-size:15px}
.howto li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--food);color:var(--go-ink);font-family:var(--f-num);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.howto li.ok{opacity:.45;text-decoration:line-through}
.howto li.ok::before{content:"✓"}
.tip{font-size:14px;border-left:3px solid var(--food);padding:4px 0 4px 12px;color:var(--muted)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}

/* ── 買い物 ── */
.weekplan{display:flex;flex-direction:column}
.wp{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wp:last-child{border-bottom:0}
.wp .d{font-family:var(--f-num);font-size:18px;font-weight:600;line-height:1.1}
.wp .d small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:700}
.wp .n{font-weight:700;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.wp .n.none{color:var(--muted);font-weight:400}
.wp .n small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.wp .ls{display:flex;flex-direction:column;gap:0;min-width:0}
.wp .sl{appearance:none;border:0;background:none;margin:0;padding:4px 0;text-align:left;font:inherit;font-size:14px;font-weight:700;line-height:1.35;color:var(--ink);display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;align-items:baseline;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere;text-wrap:pretty;-webkit-tap-highlight-color:transparent}
.wp .sl .k{font-size:11px;font-weight:700;color:var(--muted)}
.wp .sl.none .t,.wp .sl.skip .t{color:var(--muted);font-weight:400}
.wp .sl.out .t{color:var(--food)}
.wp .sl .pill{font-size:10px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.fs-now{display:flex;gap:12px;align-items:baseline;margin:0;padding:12px 14px;border-radius:14px;background:var(--raise)}
.fs-now span{flex:none;font-size:12px;color:var(--muted)}
.fs-now b{font-size:15px;overflow-wrap:anywhere}
.fs-list{display:flex;flex-direction:column;gap:6px}
.fs-row{appearance:none;width:100%;margin:0;text-align:left;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--raise);border:1px solid transparent;border-radius:14px;padding:13px 14px;cursor:pointer}
.fs-row[aria-pressed="true"]{border-color:var(--food);color:var(--food)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{appearance:none;margin:0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--food) 18%,transparent);border-color:var(--food);color:var(--food)}
.wp .ops{display:flex;gap:6px}
.icon{appearance:none;border:1px solid var(--line);background:var(--raise);border-radius:12px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shop{display:flex;flex-direction:column;gap:6px}
.shop h3{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);padding-top:10px}
.si{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.si input{appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);margin:0;cursor:pointer;display:grid;place-content:center}
.si input:checked{background:var(--prep);border-color:var(--prep)}
.si input:checked::after{content:"";width:6px;height:11px;border-right:2px solid var(--go-ink);border-bottom:2px solid var(--go-ink);transform:rotate(45deg) translate(-1px,-1px)}
.si.ok .n{color:var(--muted);text-decoration:line-through}
.si .q{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.si .n small{display:block;font-size:11px;color:var(--muted)}
.empty{font-size:14px;color:var(--muted);text-align:center;padding:20px 8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;border-radius:18px;padding:10px 18px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 40px);width:max-content;text-align:center;line-height:1.5}

/* ── 運動中 ── */
.run{position:fixed;inset:0;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;gap:10px;z-index:20;--state:var(--go);
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* 場面の色は赤と白だけ（2026-11-11 依頼者「黒い背景に赤と白」）。ワーク・ウォームアップは赤、休みは白（「レストと本番の違いがわかりにくい」） */
.run.is-prep{--state:var(--go)}
.run.is-rest{--state:var(--ink)}
.run.is-rest .ctrl button.main{color:var(--bg)}
.run.is-rest .figbox svg{opacity:.45}
.run.is-recover .figbox svg{opacity:1}
.run.is-rest .ex{font-size:clamp(34px,6vw,56px);letter-spacing:.12em}
.run.is-rest .target{font-size:18px;font-weight:700;color:var(--ink)}
.bar{display:flex;flex-direction:column;gap:6px;grid-row:1}
.run .stage,.run > .done{grid-row:2}
.ctrl{grid-row:3}
.bar .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.04em}
.segs{display:flex;gap:2px;height:10px}
.sg{border-radius:2px;background:var(--line);min-width:2px}
.sg.k-go{background:color-mix(in srgb,var(--go) 35%,var(--line))}
/* 帯も赤と白と灰色だけ：ワーク＝赤、休み＝白、ウォームアップとクールダウン＝灰色 */
.sg.k-rest{background:color-mix(in srgb,var(--ink) 45%,var(--line))}
.sg.k-prep{background:color-mix(in srgb,var(--ink) 12%,var(--line))}
.sg.past{opacity:.25}
.sg.now{background:var(--state);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--state)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;min-height:0}
.figbox{position:relative;width:100%;height:100%;min-height:180px;display:flex;align-items:center;justify-content:center}
.figbox::before{content:"";position:absolute;width:min(78%,52vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--state) 16%,transparent) 0%,transparent 70%)}
.figbox svg{position:relative;width:100%;height:100%;max-height:56vh}
.info{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.phase{font-size:13px;font-weight:700;letter-spacing:.18em;color:var(--state)}
.ex{font-size:clamp(26px,4.6vw,46px);font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.target{font-family:var(--f-num);font-size:20px;color:var(--muted);letter-spacing:.04em}
.ringbox{position:relative;width:min(70vw,38vh,300px);aspect-ratio:1;max-width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:color-mix(in srgb,var(--state) 20%,var(--bg));stroke-width:16}
.ring{fill:none;stroke:var(--state);stroke-width:16;stroke-linecap:round}
.count{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:clamp(72px,min(22vw,15vh),150px);line-height:1;color:var(--state);margin:0}
.count small{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.14em;margin-top:6px}
.run.paused .count span{opacity:.4}
.cue{font-size:clamp(16px,2.2vw,21px);max-width:32em}
.next{font-size:14px;color:var(--muted)}
.cheer{min-height:1.5em;font-size:15px;font-weight:700;letter-spacing:.12em;color:var(--state)}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:15px;padding:10px 20px;cursor:pointer;min-width:92px}
.ctrl button.main{background:var(--state);color:var(--go-ink);border-color:var(--state);font-weight:900;min-width:130px}
.ground{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.shadow{fill:var(--ink);opacity:.12}
.limb{stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;fill:none}
.limb.far{stroke:var(--far);opacity:.32}
.headc{fill:var(--ink)}
/* 拍の見本：動かす所は状態の色、終わりの姿勢は薄い線 */
.limb.move{stroke:var(--state)}
.limb.far.move{stroke:var(--state);opacity:.5}
.ghost{fill:none;stroke:var(--state);stroke-linecap:round;stroke-linejoin:round;opacity:.3}
.ghost.headg{stroke-width:3}
.path{fill:none;stroke:var(--state);stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;opacity:.8}
.pathdot{fill:var(--state)}
.figbox .beat{position:absolute;left:0;right:0;top:2%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.figbox .beat small{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.figbox .beat b{font-size:clamp(20px,3.6vw,30px);font-weight:900;line-height:1.1;color:var(--state)}
.figbox .beat .dots{display:flex;gap:7px}
.figbox .beat .dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--state) 22%,transparent)}
.figbox .beat .dots i.on{background:var(--state)}
.figbox.mini{--state:var(--go);height:min(64vw,300px);min-height:240px;margin:6px 0 2px}
.figbox.mini svg{max-height:none}
.mplan .it.tap{cursor:pointer;align-items:center}
.mplan .it .see{display:inline-flex;align-items:center;gap:4px;color:var(--go);font-size:12px;font-weight:700;margin-left:auto;white-space:nowrap}
.mplan .it .see svg{width:12px;height:12px;fill:currentColor}
.sheet .tempo{font-size:13px;color:var(--muted);margin:0}
.sheet .hint{font-size:12px;color:var(--muted);margin:0}
.settings .hint{font-size:12px;color:var(--muted);margin:2px 0 0;line-height:1.6}
.breath{fill:none;stroke:var(--rest);stroke-width:3;opacity:.55}
.run > .done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;overflow:auto;min-height:0}
.check{width:84px;height:84px}
.check circle{fill:none;stroke:var(--go);stroke-width:6;stroke-dasharray:252;stroke-dashoffset:252;animation:draw .7s ease forwards}
.check path{fill:none;stroke:var(--go);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.run > .done h2{font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:.04em}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(520px,100%)}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.sum b{display:block;font-family:var(--f-num);font-size:30px;line-height:1.1}
.sum span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.rpe{display:flex;flex-direction:column;gap:8px;width:min(520px,100%)}
.rpe .opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpe button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 4px;cursor:pointer;font-size:12px;line-height:1.3}
.rpe button b{display:block;font-family:var(--f-num);font-size:22px}
.rpe button[aria-pressed="true"]{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.rpe .opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.rpe .opts.two button{font-size:15px;padding:12px 4px}
.after{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.linkbtn{appearance:none;border:1px solid color-mix(in srgb,var(--food) 50%,var(--line));background:none;border-radius:999px;padding:6px 14px;color:var(--food);font-weight:700;cursor:pointer;font-size:13px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:25}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

/* 縦の画面・狭い画面（元の決まりより後ろ） */
@media (max-width:760px),(orientation:portrait){
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:4px}
  .ringbox{width:min(54vw,27vh,240px)}
  .count{font-size:clamp(56px,min(16vw,9vh),110px)}
  .ex{font-size:clamp(24px,7vw,36px)}
  .ctrl{flex-wrap:nowrap;gap:6px}
  .ctrl button{min-width:0;flex:1;padding:10px 6px;font-size:14px}
  .ctrl button.main{min-width:0;flex:1.4}
}
.wp .n,.pick .n,.slot .n,.sheet h2,.hero .name,.mrow .n,.howto li{text-wrap:pretty}
.wp .n,.pick .n,.slot .n,.sheet h2{word-break:keep-all;overflow-wrap:anywhere}
/* 種目名・メニュー名も、改行は名() が入れる所（かっこの前など）だけ。「（」が行の端に残らないように（2026-11-11 依頼者「見苦しい」） */
.nb{white-space:nowrap}
.ex,.run .target,.run .next,.mrow .n,.hero .name,.ladder .nm,.ladder .nx,.mplan .it .nm2,.title .name{word-break:keep-all;overflow-wrap:anywhere;text-wrap:balance}
@media (max-width:420px){
  .wp{grid-template-columns:46px minmax(0,1fr) auto;gap:8px}
  .wp .ops{gap:4px}
  .icon{width:34px;height:34px}
  .wp .n{font-size:14px}
  .wp .n small{display:none}
  .daymeals{grid-template-columns:1fr;gap:6px}
  .slot{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px}
  .slot .n{font-size:13px;line-height:1.4}
  #v-shop .toolbar .go{flex-basis:100%}
  .hero .k{font-size:56px}
  .stat b{font-size:28px}
  .week{grid-template-columns:1fr}
  .goal{width:80px;height:80px;justify-self:start}
  .day .dot{width:30px;height:30px;font-size:16px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vhead h1{font-size:24px}
}
@media (prefers-reduced-motion: reduce){
  .check circle,.check path{animation:none;stroke-dashoffset:0}
  .confetti{display:none}
  .goal .fg,.meter .bar i,.switch input,.switch input::after{transition:none}
}
</style>

function 日ごと(){
  const m = {};
  for (const e of 記録()) if (やった(e)){ m[e['日']] = m[e['日']] || {分:0, 記:[]}; m[e['日']].分 += e['秒'] / 60; m[e['日']].記.push(e['記']) }
  return m;
}
function 週の数(始め, 日ご){ let n = 0; for (let i = 0; i < 7; i++) if (日ご[日付(足す日(始め, i))]) n++; return n }
function 数字(){
  const 日ご = 日ごと(), 今週 = 週の始め(new Date(運動の日() + 'T12:00'));
  let 連続 = 0, w = 今週;
  if (週の数(w, 日ご) < 達成ライン) w = 足す日(w, -7);
  while (週の数(w, 日ご) >= 達成ライン){ 連続++; w = 足す日(w, -7) }
  const 全 = 記録().filter(やった);
  return {今週: 週の数(今週, 日ご), 連続, 回: 全.length, 分: Math.round(全.reduce((a, e) => a + e['秒'], 0) / 60), 日ご};
}

/* ── 予定 ── */
function 予定の日(d){ const x = 予定[d]; return x && メ(x['記号']) ? x : null }
function 今日の予定(){
  const t = 運動の日(), x = 予定の日(t);
  const 次 = Object.keys(予定).filter(d => d > t && 予定の日(d)).sort()[0];
  return {t, x, 次, y: 次 ? 予定[次] : null};
}

/* 週ごとのトレーニング回数（2026-11-11 依頼者「アクティビティの表示は意味がわからん」。日ごとの四角から、週ごとの棒に替えた） */
function マス目(){
  const s = 数字(), 始め = 足す日(週の始め(new Date()), -49);
  const 週々 = Array.from({length: 8}, (_, w) => {
    const 頭 = 足す日(始め, w * 7); let 回 = 0, 分 = 0;
    for (let i = 0; i < 7; i++){ const d = 日付(足す日(頭, i)); if (s.日ご[d] && s.日ご[d].分 > 0){ 回++; 分 += s.日ご[d].分 } }
    return {頭, 回, 分};
  });
  // 縦の幅は「目標より1つ上」か「いちばん多い週」の大きいほう（棒が低く見えないように）
  const 上 = 10, 下 = 120, 高さ = 下 - 上, 最大 = Math.max(目標 + 1, ...週々.map(x => x.回)), 幅 = 26, 間 = 37, 左 = 20;
  const y = n => 下 - 高さ * n / 最大;
  let h = `<line class="wc-goal" x1="${左 - 8}" x2="${左 + 7 * 間 + 幅 + 8}" y1="${y(目標)}" y2="${y(目標)}"/>`;
  週々.forEach(({頭, 回, 分}, w) => {
    const x = 左 + w * 間, 今 = w === 7, 達 = 回 >= 目標;
    if (回){
      h += `<rect class="wc-bar${今 ? ' now' : ''}${達 ? ' ok' : ''}" x="${x}" y="${y(回)}" width="${幅}" height="${下 - y(回)}" rx="5"><title>${日付(頭)}の週：${回}回・${Math.round(分)}分</title></rect>`;
      h += `<text class="wc-n" x="${x + 幅 / 2}" y="${y(回) + 14}">${回}</text>`;
    } else {
      h += `<rect class="wc-bar zero" x="${x}" y="${下 - 3}" width="${幅}" height="3" rx="1.5"/><text class="wc-n z" x="${x + 幅 / 2}" y="${下 - 8}">0</text>`;
    }
    h += `<text class="wc-d${今 ? ' now' : ''}" x="${x + 幅 / 2}" y="${下 + 17}">${今 ? '今週' : `${頭.getMonth() + 1}/${頭.getDate()}`}</text>`;
  });
  h += `<line class="wc-axis" x1="${左 - 8}" x2="${左 + 7 * 間 + 幅 + 8}" y1="${下}" y2="${下}"/>`;
  $('heat').innerHTML = h;
  $('wnote').textContent = `棒＝その週にトレーニングした日の数（下の日付は週の始め）。点線＝週の目標（${目標}回）。目標に届いた週は明るい色`;
}

const 好み = Object.assign({忙しさ: 3, 味: [], 傾向: [], 除外: '', 区分: '夕', 調達: '自炊'}, 保存.get('好み', {}));

const おにぎり数 = g => Math.max(1, Math.round(g / 100));
/* 献立＝EDIT FLOW が決めた献立（予定.json の 献立）に、この端末で選んだ上書きを重ねたもの。
   上書きは EDIT FLOW へ送り、反映されたら消す。上書きの '' は「おまかせに戻す」 */
let 食予E = {}, 食の文字E = {}, 選ぶ日 = null;   // 食予E＝予定.json の 食の予定 {日: {朝・昼・夕: 「実家で夕食」などの文字 か 'なし'}}。選ぶ日＝候補から選ぶ日（今日以外のとき）
let 献立E = {}, 買い物E = null, 栄養E = {}, 在庫E = {}, 使い切れないE = [], 期限切れE = [], 食材E = {};
const 上書き = () => 保存.get('献立', {});
/* 食事の決まり：この端末で決めた分（'' はふつうどおり）を、EDIT FLOW の分に重ねる。EDIT FLOW に反映されたら消す */
const 食予の直し = () => 保存.get('食の予定', {});
function 食の決まり(d, 区分){
  const u = (食予の直し()[d] || {})[区分];
  if (u !== undefined) return u || null;
  return (食予E[d] || {})[区分] || null;
}
const 外の予定 = (d, 区分) => { const t = 食の決まり(d, 区分); return t && t !== 'なし' ? t : null };
function 食を決める(d, 区分, 文字){
  // 文字：場所（「実家で夕食」「外食」など）／'なし'（食べない）／''（ふつうどおり＝献立を組む）
  const u = 食予の直し(); u[d] = u[d] || {}; u[d][区分] = 文字; 保存.set('食の予定', u);
  const z = 区分 === '夕' ? '夜' : 区分;
  const ops = [{道: ['日', d, z], 値: 文字, 作る: true}];
  if (!文字) ops.push({道: ['日', d, z + 'の時刻'], 値: null, 作る: true}, {道: ['日', d, z + 'の移動'], 値: 0, 作る: true});   // 毎週の決まり（実家の19時など）も、この日は外す
  送りに積む(ops);
  if (文字) 献立に入れる(d, 区分, null);
}
function 食予を片付ける(){
  const u = 食予の直し(), t = 今日();
  for (const d of Object.keys(u)){
    if (d < t){ delete u[d]; continue }
    for (const [z, v] of Object.entries(u[d])) if ((v || '') === ((食予E[d] || {})[z] || '')) delete u[d][z];
    if (!Object.keys(u[d]).length) delete u[d];
  }
  保存.set('食の予定', u);
}
function 献立(){
  const out = {};
  for (const [d, v] of Object.entries(献立E)){ out[d] = {}; for (const [k, x] of Object.entries(v)) out[d][k] = x.id }
  for (const [d, v] of Object.entries(上書き())){
    out[d] = out[d] || {};
    for (const [k, id] of Object.entries(v)){ if (id) out[d][k] = id; else if (献立E[d] && 献立E[d][k] && 献立E[d][k].指定) delete out[d][k] }
  }
  return out;
}
function 指定か(d, k){ const u = (上書き()[d] || {})[k]; if (u !== undefined) return !!u; return !!(献立E[d] && 献立E[d][k] && 献立E[d][k].指定) }
function 献立に入れる(d, 区分, id){
  const k = 上書き(); k[d] = k[d] || {}; k[d][区分] = id || ''; 保存.set('献立', k);
  送りに積む([{道: ['献立', d, 区分], 値: id || null, 作る: true}]);
  if (id && 食の決まり(d, 区分)) 食を決める(d, 区分, '');   // 外食・なし の枠に献立を入れたら、ふつうどおりに戻す
}
function 上書きを片付ける(){
  // EDIT FLOW に反映された上書きと、過ぎた日の上書きを消す
  const k = 上書き(), t = 今日();
  for (const d of Object.keys(k)){
    if (d < t){ delete k[d]; continue }
    for (const [z, id] of Object.entries(k[d])){
      const e = 献立E[d] && 献立E[d][z];
      if ((id && e && e.指定 && e.id === id) || (!id && !(e && e.指定))) delete k[d][z];
    }
    if (!Object.keys(k[d]).length) delete k[d];
  }
  保存.set('献立', k);
}

/* ── EDIT FLOW へ送る（EDITFLOW-data の 変更/ に1件ずつ。Mac の EDITFLOW が1分ごとに取り込む）── */
const 連携 = {repo: 'editroom1980/EDITFLOW-data'};
連携.鍵 = () => { try{ return localStorage.getItem('nagara:トークン') || localStorage.getItem('EF_トークン') }catch(e){ return null } };
let 送る時計 = null, 送り状態 = '';
function 送りに積む(ops){
  const q = 保存.get('送る', []);
  for (const o of ops){
    // 同じ道への操作は最後の1つだけ残す
    const key = JSON.stringify(o.道);
    const i = q.findIndex(x => JSON.stringify(x.道) === key); if (i >= 0) q.splice(i, 1);
    q.push(o);
  }
  保存.set('送る', q);
  clearTimeout(送る時計); 送る時計 = setTimeout(送る, 1500);
}
let 送信中 = false;
async function 送る(){
  if (送信中) return;
  const q = 保存.get('送る', []), t = 連携.鍵();
  if (!q.length){ 連携の表示(); return }
  if (!t){ 送り状態 = '未接続'; 連携の表示(); return }
  const n = new Date(), 名 = `${日付(n).replace(/-/g, '')}-${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}${String(n.getSeconds()).padStart(2,'0')}-nagara-${Math.random().toString(36).slice(2, 7)}.json`;
  const 字 = JSON.stringify({ファイル: '食事の予定.json', 操作: q, _: '宅トレから'}, null, 1);
  const b64 = btoa(Array.from(new TextEncoder().encode(字), c => String.fromCharCode(c)).join(''));
  送信中 = true;
  try{
    const r = await fetch(`https://api.github.com/repos/${連携.repo}/contents/${encodeURIComponent('変更')}/${名}`, {
      method: 'PUT', headers: {Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
      body: JSON.stringify({message: '宅トレ：献立と好み', content: b64})});
    if (r.ok){
      // 送っている間に積まれた操作は残す（同じ道の操作は積むときに置き換わるので、送った中身と同じものだけを消す）
      const 送った = new Set(q.map(o => JSON.stringify(o)));
      保存.set('送る', 保存.get('送る', []).filter(o => !送った.has(JSON.stringify(o))));
      保存.set('送った', Date.now()); 送り状態 = '';
    } else 送り状態 = r.status === 401 || r.status === 403 ? '鍵が無効' : r.status === 404 ? '置き場が見えない' : `送信失敗（${r.status}）`;
  }catch(e){ 送り状態 = 'オフライン' }

/* ── 外で食べたものの記録：文か写真を Mac の判定役（Claude）に送り、料理ごとの量と栄養を受け取る ──
   送り先は EDITFLOW-data の 判定/依頼/。Mac が 判定/結果/ に書いたものを数秒おきに読む */
const 置き場 = (...a) => `https://api.github.com/repos/${連携.repo}/contents/` + a.map(encodeURIComponent).join('/');
const 頭 = t => ({Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'});
function b64utf8(字){ const u = new TextEncoder().encode(字); let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b) }
function 画を縮める(file){
  return new Promise((ok, ng) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1024 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', .75));
    };
    im.onerror = () => { URL.revokeObjectURL(u); ng(new Error('写真を読めない')) };
    im.src = u;
  });
}
let 判定の時計 = null, 記録の区分 = '昼';
/* Gemini の鍵（新しい形は AQ.…、前の形は AIza…）はこの端末の localStorage にだけ置き、Google の API のほかへは送らない */
const G先 = () => `https://generativelanguage.googleapis.com/v1beta/models/${Gのモデル}:generateContent`;
async function G呼ぶ(鍵, body){
  // ふつうは x-goog-api-key の欄で渡す。401・403 で断られたら、URL に付ける渡し方でもう一度（新しい形の鍵で断られる例があるため）
  const r = await fetch(G先(), {method: 'POST', headers: {'Content-Type': 'application/json', 'x-goog-api-key': 鍵}, body: JSON.stringify(body)});
  if (r.status !== 401 && r.status !== 403) return r;
  return fetch(G先() + '?key=' + encodeURIComponent(鍵), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
}
const G理由 = async r => { try{ const j = await r.clone().json(); return ((j.error || {}).status || '') + ' ' + ((j.error || {}).message || '') }catch(e){ return '' } };
const 鍵G = () => { try{ return localStorage.getItem('nagara:gemini') || '' }catch(e){ return '' } };
const Gのモデル = 'gemini-3.5-flash-lite';
function G指示(区分, 文, 写真あり){
  return `あなたは日本の管理栄養士です。46歳の男性（158cm・${Math.round(体重)}kg・体脂肪を落として筋肉を保つ減量中）が${区分名[区分]}に食べたものの栄養を見積もります。
${写真あり ? '- 添えた写真を見る（皿・器・箸の大きさから量を見積もる）' : '- 写真はない'}
- 文：${文 || '（なし）'}
手順：1) 料理を1品ずつ挙げる（ご飯・汁・小鉢・ソース・ドレッシング・飲み物も） 2) 店名・チェーン名・メニュー名があれば Google 検索で公式の栄養成分表示を探し、その値を使う（無ければ似たメニューの公式値から） 3) 「半分残した」「大盛り」などは食べた量に直す 4) 揚げ油・炒め油・マヨネーズを見落とさない 5) 合計と誤差の幅
次の形の JSON だけを返す（説明の文は付けない）：
{"title":"食べたものの短い名前（20字以内）","items":[{"name":"料理名","amount":"量（g など）","kcal":0,"p":0,"f":0,"c":0}],"kcal":0,"p":0,"f":0,"c":0,"range":"±100kcal","confidence":"高|中|低","source":"公式|検索|推定","note":"このあとの食事で何を調整すればよいか（40字以内）"}
数値は整数。p＝たんぱく質・f＝脂質・c＝炭水化物（g）。文字はすべて日本語。`;
}
async function Gで判定(区分, 文, 画, 検索 = true){
  const 鍵 = 鍵G(); if (!鍵) throw new Error('Gemini の鍵が未設定');
  const parts = [{text: G指示(区分, 文, !!画)}];
  if (画) parts.push({inline_data: {mime_type: 'image/jpeg', data: 画.split(',')[1]}});
  const body = {contents: [{role: 'user', parts}], generationConfig: {temperature: 0.2}, ...(検索 ? {tools: [{google_search: {}}]} : {})};
  const r = await G呼ぶ(鍵, body);
  const j = await r.json().catch(() => ({}));
  if (!r.ok){
    const m = ((j.error || {}).message || '') + '';
    // 無料の鍵では Google 検索が使えない。そのときは検索なしでもう一度
    if (検索 && (r.status === 400 || r.status === 403 || r.status === 429) && /search|ground|tool|free|tier|billing|quota/i.test(m)) return Gで判定(区分, 文, 画, false);
    throw new Error((r.status === 400 || r.status === 401) && /API key not valid/i.test(m) ? '鍵が無効（コピーが途中で切れていないか確認）' : r.status === 429 ? '回数の上限（少し待つ）' : `判定できなかった（${r.status}：${m.slice(0, 120)}）`);
  }
  const c = (j.candidates || [])[0] || {};
  const 字 = ((c.content || {}).parts || []).map(x => x.text || '').join('');
  const 塊 = 字.match(/\{[\s\S]*\}/);
  if (!塊) throw new Error('答えを読めなかった');
  let 結果;
  try{ 結果 = JSON.parse(塊[0]) }catch(e){ throw new Error('答えを読めなかった') }
  結果.出典 = (((c.groundingMetadata || {}).groundingChunks) || []).map(x => x.web).filter(Boolean).slice(0, 3);
  結果.検索 = 検索;
  return 結果;
}
function 鍵の欄(){

/* ════════ 家にある食材 ════════ */
const 在庫の直し = () => 保存.get('在庫の直し', {});   // 送ったが Mac でまだ反映されていない直し {材料: 量}
function 家の食材(){
  const el = $('pantry'); if (!el) return;
  const 直 = 在庫の直し(), t = 今日();
  const 全 = Object.entries(在庫E).map(([n, v]) => [n, n in 直 ? [直[n], (v || [])[1] || '', (v || [])[2]] : v]);
  const 行 = 全.filter(([n, v]) => v && v[0] > 0);
  // 量の分からない前の形の在庫は分けて出す（量のある品と同じ食材は出さない）
  const 未 = 全.filter(([n, v]) => v === null && !行.some(([m]) => 素名(m) === 素名(n) || 素名(m).includes(素名(n)) || 素名(n).includes(素名(m)))).map(([n]) => n);
  const 残り日 = 期 => 期 ? Math.round((new Date(期 + 'T00:00') - new Date(t + 'T00:00')) / 864e5) : null;
  行.sort((a, b) => ((a[1] && a[1][2]) || '9') < ((b[1] && b[1][2]) || '9') ? -1 : 1);
  // 使い切れない見込み：冷凍できる肉・魚などは札にして「冷凍した」を押せるように。ほかは1行にまとめる
  const 見込み外 = 使い切れないE.filter(x => x.期限 >= t);
  const 警 = 見込み外.filter(x => x.冷凍).map(x => `<div><span><b>${esc(x.名)}</b> 約${量(x.量, x.単位)}は ${esc(日の名(x.期限))} までに使い切れない見込み。冷凍しておく</span><button type="button" class="linkbtn" data-freeze="${esc(x.名)}">冷凍した</button></div>`).join('');
  const ほか = 見込み外.filter(x => !x.冷凍).map(x => `${esc(x.名)} ${量(x.量, x.単位)}`);
  el.innerHTML = `<div class="toolbar"><p class="label"><abbr title="Mac の EDIT FLOW が数える量。買った量や使った量が違えば「直す」">家にある食材</abbr></p><span class="pill">${行.length}品</span></div>
    ${警 ? `<div class="warn">${警}</div>` : ''}${ほか.length ? `<p class="muted" style="font-size:12px;margin-bottom:6px">期限までに少し残りそう：${ほか.join('、')}（献立が変われば使われる）</p>` : ''}
    <div class="pantry">${行.map(([n, v]) => {
      const 日 = v && v[2] ? 残り日(v[2]) : null;
      return `<div class="pt" data-n="${esc(n)}"><span>${esc(n)}</span><span class="q">${量(v[0], v[1]) || v[0]}</span>
        <span class="d ${日 !== null && 日 <= 2 ? 'soon' : ''}">${日 === null ? '' : 日 <= 0 ? '今日まで' : 'あと' + 日 + '日'}</span>
        <div class="ed" hidden><input class="text" type="number" inputmode="decimal" min="0" step="any" value="${v ? v[0] : ''}" aria-label="${esc(n)}の量"><span class="muted">${esc((v && v[1]) || '')}</span><button type="button" class="linkbtn" data-save>決定</button></div></div>`;
    }).join('') || '<p class="empty">まだ数えた食材が無い。買い物リストで「済み」にすると入る</p>'}</div>
    ${未.length ? `<p class="muted" style="font-size:12px;margin-top:8px">量が未確認（あるものとして献立に使う）：${未.map(esc).join('、')}</p>` : ''}
    <details class="more-f" style="margin-top:10px"><summary>食材を足す・量を直す</summary><div class="addrow" style="margin-top:10px">
      <select id="pt-n" aria-label="食材">${Object.keys(食材E).sort().map(n => `<option>${esc(n)}</option>`).join('')}</select>
      <input class="text" id="pt-q" type="number" inputmode="decimal" min="0" step="any" placeholder="いまある量" style="flex:1 1 90px">
      <button type="button" class="go ghost" id="pt-add" style="flex:0 0 auto;padding:12px 18px;font-size:15px;letter-spacing:.06em">決定</button></div>
      <p class="muted" style="font-size:12px;margin-top:6px">量はレシピと同じ単位（肉は g、卵は個、豆腐は丁）。行を押すと、その食材の量を直せる</p></details>
    ${期限切れE.length ? `<p class="muted" style="font-size:12px;margin-top:8px">期限切れ：${期限切れE.slice(-5).map(x => esc(x.名) + ' ' + 量(x.量, x.単位)).join('、')}</p>` : ''}`;
  const 直す = (n, q) => {
    const a = 在庫の直し(); a[n] = q; 保存.set('在庫の直し', a);
    送りに積む([{道: ['在庫の直し', n], 値: q, 作る: true}]); 知らせ(`${n} を ${q} に直した（Mac で1〜2分後に献立へ反映）`); 家の食材();
  };
  el.querySelectorAll('.pt').forEach(r => {
    r.querySelector('span').addEventListener('click', () => { const e = r.querySelector('.ed'); e.hidden = !e.hidden; if (!e.hidden) e.querySelector('input').focus() });
    r.querySelector('[data-save]').addEventListener('click', () => { const q = +r.querySelector('.ed input').value; if (q >= 0) 直す(r.dataset.n, q) });
  });
  el.querySelectorAll('[data-freeze]').forEach(b => b.addEventListener('click', () => {
    送りに積む([{道: ['冷凍した', b.dataset.freeze], 値: true, 作る: true}]);
    使い切れないE = 使い切れないE.filter(x => x.名 !== b.dataset.freeze); 知らせ(`${b.dataset.freeze} を冷凍（3週間もつ）`); 家の食材();
  }));
  $('pt-add').addEventListener('click', () => { const n = $('pt-n').value, q = +$('pt-q').value; if (n && q >= 0 && $('pt-q').value !== '') 直す(n, q) });
}
function 直しを片付ける(){
  // Mac に反映された直し（在庫の量が一致したもの）を消す
  const a = 在庫の直し();
  for (const [n, q] of Object.entries(a)) if (在庫E[n] && Math.abs(在庫E[n][0] - q) < 1e-6 || (q === 0 && !在庫E[n])) delete a[n];
  保存.set('在庫の直し', a);
}

/* ════════ 買い物 ════════ */
const 売り場の順 = ['肉魚', '卵豆乳', '野菜', '冷凍', '乾物缶', 'コンビニ', '調味料'];
const 売り場の名 = {肉魚: '肉・魚', 卵豆乳: '卵・豆腐・乳製品', 野菜: '野菜・果物', 冷凍: '冷凍食品', 乾物缶: '缶詰・乾物', コンビニ: 'コンビニ', 調味料: '常備調味料'};
const 七日 = () => Array.from({length: 7}, (_, i) => 日付(足す日(new Date(), i)));
const 外食 = d => 外の予定(d, '夕');
const 夕の決まり = d => 食の決まり(d, '夕');   // 外食・なし のどちらか（献立を入れない日）
let 外食の日 = {};
function 自動作成(全部){
  const k = 献立(), 使用 = new Set(), 主の数 = {};
  const 数える = id => { const r = R食(id); if (r){ 使用.add(id); 主の数[r['主']] = (主の数[r['主']] || 0) + 1 } };
  for (const d of 七日()) if (!全部 && k[d] && k[d]['夕']) 数える(k[d]['夕']);
  let n = 0;
  for (const d of 七日()){
    if (夕の決まり(d)){ if (全部) 献立に入れる(d, '夕', null); continue }
    if (!全部 && k[d] && k[d]['夕']) continue;
    const c = 候補('夕', d, 使用, 主の数)[0]; if (!c) continue;
    献立に入れる(d, '夕', c.id); 数える(c.id); n++;
  }
  知らせ(n ? `${n}日分を作成` : '未設定日なし');
  全体();
}
function 入れ替え(d){
  const k = 献立(), 今 = k[d] && k[d]['夕'];
  if (夕の決まり(d)) return;
  const 使用 = new Set(七日().map(x => (k[x] || {})['夕']).filter(Boolean));
  const 次 = 候補('夕', d, 使用).find(r => r.id !== 今);
  if (次){ 献立に入れる(d, '夕', 次.id); 全体() }
}
function 買い物(){
  const k = 献立(), wp = $('weekplan');
  const E連携 = Object.keys(献立E).length > 0;
  $('b-auto').hidden = E連携; $('b-redo').hidden = E連携; $('b-omakase').hidden = !E連携;
  連携の表示(); 家の食材();
  let 数 = 0;
  wp.innerHTML = 七日().map(d => {
    const x = k[d] || {}, 決 = 夕の決まり(d), r = !決 && x['夕'] && R食(x['夕']), 型 = 日の型(d);
    if (r || 決) 数++;
    const 行 = 区分の順.map(z => {
      const v = 食の値(d, z), cls = v.状態 === '抜き' ? 'skip' : v.状態 === '外の予定' || v.状態 === '外' ? 'out' : v.名 ? '' : 'none';
      const 印 = E連携 && v.状態 === '予定' && 指定か(d, z) ? '<span class="pill t-food">指定</span>' : v.状態 === '済' ? '<span class="pill t-go">食べた</span>' : '';
      return `<button type="button" class="sl ${cls}" data-d="${d}" data-z="${z}" aria-label="${日の名(d)}の${区分名[z]}を設定"><span class="k">${区分名[z].slice(0, 1)}</span><span class="t">${v.名 ? 名(v.名) : '未設定'}${印}</span></button>`;
    }).join('');
    return `<div class="wp"><div class="d">${Number(d.slice(5,7))}/${Number(d.slice(8))}<small>${d === 今日() ? '本日' : 曜[new Date(d + 'T00:00').getDay()] + '曜'}${型.記 ? '・' + 型.記 : ''}</small></div>
      <div class="ls">${行}</div>
      <div class="ops">${r ? `<button type="button" class="icon" data-swap="${d}" aria-label="夕食を入れ替え" title="夕食を入れ替え"><svg viewBox="0 0 24 24"><path d="M4 9h13l-3-3M20 15H7l3 3"/></svg></button>` : 決 ? '' : `<button type="button" class="icon" data-swap="${d}" aria-label="夕食を自動で設定" title="夕食を自動で設定"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>`}</div></div>`;
  }).join('');
  $('wp-count').textContent = `${数}/7`;
  wp.querySelectorAll('[data-swap]').forEach(b => b.addEventListener('click', () => 入れ替え(b.dataset.swap)));
  wp.querySelectorAll('.sl').forEach(b => b.addEventListener('click', () => 枠シート(b.dataset.z, b.dataset.d)));

  // EDIT FLOW の買い物リスト（リマインダー「買い物」と同じ中身）
  if (E連携 && 買い物E && 買い物E['もの']){
    const 済 = 保存.get('買い物済', {});
    const 待ち = Object.keys(上書き()).length || 保存.get('送る', []).length;
    const 群 = {};
    for (const [名前, メモ, 材] of 買い物E['もの']){
      const m = 名前.match(/^【(.+?)】(.+)$/), 場 = m ? m[1] : 'そのほか', 品 = m ? m[2] : 名前;
      (群[場] = 群[場] || []).push([名前, 品, メモ, 材]);
    }
    const 全 = 買い物E['もの'].length, 残 = 買い物E['もの'].filter(([n]) => !済[n]).length;
    $('shop-left').textContent = `残り ${残}/${全}`;
    $('o-pantry').closest('label').hidden = true;
    let html = `<p class="muted" style="font-size:13px;padding-top:6px">次の買い物 ${日の名(買い物E['日'])}・リマインダー「買い物」と同じ内容。売っている単位（パック）で書いてあり、済みにするとその量を在庫に足す。量が違えば「家にある食材」で直す${待ち ? '<br><span style="color:var(--food)">献立の変更を反映中（Mac で1〜2分）</span>' : ''}</p>`;
    for (const [場, 行] of Object.entries(群)){
      html += `<h3>${esc(場)}</h3>` + 行.map(([名前, 品, メモ, 材]) => `<label class="si ${済[名前] ? 'ok' : ''}"><input type="checkbox" data-key="${esc(名前)}" data-zai="${esc(材 || '')}" ${済[名前] ? 'checked' : ''}><span class="n">${esc(品)}<small>${esc(メモ)}</small></span><span class="q"></span></label>`).join('');
    }
    $('shoplist').innerHTML = html;
    $('shoplist').querySelectorAll('input[data-key]').forEach(c => c.addEventListener('change', () => {
      const s = 保存.get('買い物済', {}); if (c.checked) s[c.dataset.key] = true; else delete s[c.dataset.key]; 保存.set('買い物済', s);
      // 買った品は Mac に送り、在庫に量を足す（リマインダーも済みになる）
      if (c.checked && c.dataset.zai && c.dataset.zai !== '見て') 送りに積む([{道: ['買った', c.dataset.zai], 値: true, 作る: true}]);
      買い物();
    }));
    return;
  }
  $('o-pantry').closest('label').hidden = false;
  // 合計
  const 合 = {};
  for (const d of 七日()){
    const x = k[d] || {};
    for (const id of Object.values(x)){
      const r = R食(id); if (!r) continue;
      for (const [名, 数, 単位, 場] of r['材料']){
        if (場 === 'セブン') continue;
        const key = 名 + '|' + 単位;
        合[key] = 合[key] || {名, 単位, 場, 数: 0, 品: new Set()};
        合[key].数 += 数 || 0; 合[key].品.add(r['名前']);
      }
    }
  }
  const 済 = 保存.get('買い物済', {}), 調味料も = 保存.get('調味料も', false);
  $('o-pantry').checked = 調味料も;
  const 品々 = Object.entries(合).filter(([, v]) => 調味料も || v.場 !== '調味料');
  const 残 = 品々.filter(([key]) => !済[key]).length;
  $('shop-left').textContent = 品々.length ? `残り ${残}/${品々.length}` : '0品';
  if (!品々.length){ $('shoplist').innerHTML = '<p class="empty">献立が未設定。「未設定日を自動作成」で開始</p>'; return }
  let html = '';
  for (const 場 of 売り場の順){
    const 群 = 品々.filter(([, v]) => v.場 === 場); if (!群.length) continue;
    html += `<h3>${売り場の名[場]}</h3>` + 群.map(([key, v]) => `<label class="si ${済[key] ? 'ok' : ''}"><input type="checkbox" data-key="${esc(key)}" ${済[key] ? 'checked' : ''}><span class="n">${esc(v.名)}<small>${esc([...v.品].slice(0, 2).join('・'))}${v.品.size > 2 ? ' ほか' : ''}</small></span><span class="q">${量(v.数, v.単位)}</span></label>`).join('');
  }
  $('shoplist').innerHTML = html;
  $('shoplist').querySelectorAll('input[data-key]').forEach(c => c.addEventListener('change', () => {
    const s = 保存.get('買い物済', {}); if (c.checked) s[c.dataset.key] = true; else delete s[c.dataset.key]; 保存.set('買い物済', s); 買い物();
  }));
}
