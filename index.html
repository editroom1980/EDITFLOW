<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EDITFLOW">
<meta name="theme-color" content="#06060d">
<title>EDITFLOW — 撮影・編集の進行管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand-name">EDIT<em>FLOW</em><span class="brand-version">v2.0</span></div>
    <div class="screen-title" id="screenTitle"></div>
    <button class="tb-btn wide-only" data-act="palette" title="命令窓を開く（⌘K）">⌘K <span class="kbd">命令</span></button>
    <button class="tb-btn" data-act="newProject" title="新しい案件を作る（⌘N）"><span>＋<span class="wide-only"> 新しい案件</span></span></button>
    <button class="tb-btn" id="btnCalc" data-act="calc" title="エンジンを引数なしで走らせ、割り振りを作り直す（カレンダーは読むだけ）（⌘R）"><span>計算<span class="wide-only">し直す</span></span></button>
    <button class="tb-btn primary" id="btnReflect" data-act="reflect" title="作業ブロック・締切・食事をカレンダーへ、段取りの通知をリマインダーへ入れる（⇧⌘R）"><span><span class="mark" id="reflectMark"></span><span class="wide-only">カレンダーとリマインダーへ</span>反映</span></button>
    <button class="tb-btn wide-only" data-act="toggleDetail" title="右の詳細の欄を出し入れする（⌥⌘I）">▥</button>
    <button class="tb-btn" data-act="prefs" title="設定（見た目・つなぎ方）（⌘,）">⚙</button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
  <aside class="detail" id="detail"></aside>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<div class="overlay" id="overlay" data-act="closeAll"></div>
<div class="palette" id="palette">
  <input id="palInput" placeholder="命令・案件・工程を探す（↑↓ で選び、return で実行、esc で閉じる）" autocomplete="off">
  <div class="pal-list" id="palList"></div>
</div>
<div class="sheet" id="sheet">
  <div class="sheet-header" id="sheetHeader"></div>
  <div class="sheet-content" id="sheetContent"></div>
  <div class="sheet-footer" id="sheetFooter"></div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
